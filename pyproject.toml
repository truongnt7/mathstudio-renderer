[project]
name = "mathstudio-renderer"
version = "0.1.0"
description = "Dockerized Manim renderer runtime for AI Math Studio (M2-B3.1)"
requires-python = ">=3.12"
dependencies = [
    "manim==0.20.1",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "orjson>=3.10,<4",
    "pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-Pillow",
]

[project.scripts]
mathstudio-renderer = "mathstudio_renderer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathstudio_renderer"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit security
    "N",   # pep8 naming
    "W",   # pycodestyle warnings
]
ignore = [
    "S101",  # Use of assert (needed in tests)
    "S603",  # subprocess with shell=False is explicitly desired
    "S607",  # partial path is fine when we control it
    "B008",  # function call in defaults (Typer uses this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "B904"]
# Manim scenes use star imports by convention — F401/F403/F405 are expected
"src/mathstudio_renderer/scenes/**" = ["F401", "F403", "F405", "E501", "N802", "N806"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["manim.*", "manimpango.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mathstudio_renderer.scenes.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests that render locally (slow, needs Manim)",
    "docker: marks tests that require Docker image to be built",
    "latex: marks tests that require LaTeX/dvisvgm",
    "slow: marks slow tests",
]
addopts = "--tb=short -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/mathstudio_renderer"]
omit = ["*/scenes/*"]  # Manim scenes tested via integration

[tool.coverage.report]
show_missing = true
skip_covered = false
